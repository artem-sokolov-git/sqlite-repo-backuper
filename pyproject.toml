[project]
name = "sqlite-repo-backuper"
version = "0.1.0"
description = "Scheduled SQLite backups to a private GitHub repository"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sqlite-repo-backuper = "sqlite_repo_backuper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_repo_backuper"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
